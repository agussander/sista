<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Widget</title>
  
  <!-- Estilos del widget -->
  <link rel="stylesheet" href="/chat_web/widget_chatbot.css">
</head>
<body>

<!-- Socket.io CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.js"></script>

<!-- Audio de notificación desde archivo externo -->
<audio id="notification-sound" preload="auto">
  <source src="/chat_web/notification.mp3" type="audio/mpeg">
</audio>

<div id="chat-widget">
  <button id="chat-button"></button>
  <div id="chat-window">
    <div id="chat-header">Chat</div>
    <div id="chat-body"></div>
    <div id="chat-footer">
      <input type="text" id="mensaje" placeholder="Escribe un mensaje...">
      <button onclick="enviarMensaje()">Enviar</button>
    </div>
    <div class="drag-indicator">Suelta los archivos aquí</div>
  </div>
</div>

<!-- Modal para ampliar imágenes -->
<div id="image-modal">
  <img src="" alt="Imagen ampliada">
</div>

<!-- Lógica del chatbot -->
<script src="/chat_web/widget_chatbot_api.js"></script>
<script src="/chat_web/widget_chatbot_ui.js"></script>

</body>
</html>
