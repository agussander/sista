<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.jpg" />
		<link rel="stylesheet" href="%sveltekit.assets%/hide-recaptcha-badge.css">

		<!-- Warm up la conexión a PocketBase (DNS + TLS) antes de que el JS
		     pida los datos/imágenes, para acelerar su carga. -->
		<link rel="preconnect" href="https://sista.pockethost.io" crossorigin />
		<link rel="dns-prefetch" href="https://sista.pockethost.io" />
		
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light" />
		<meta http-equiv="Permissions-Policy" content="unload=(self 'https://www.google.com')" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- Google Tag Manager (noscript) -->
		<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-W3WFBRF7"
		height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
		<!-- End Google Tag Manager (noscript) -->
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
<style>
	html {
		max-width: 100%;
		overflow-x: hidden;
		margin: 0;
		padding: 0;
	}
	body {
		margin: 0;
		padding: 0;
	}
</style>
